name: Quality Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            mlbops/api/requirements-api.txt
      - run: pip install -r requirements.txt -r mlbops/api/requirements-api.txt
      - run: python -m compileall -q mlbops/api src jobs
      - run: python -m unittest discover -s tests -p "test_*.py"

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlbops/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mlbops/hub/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
