services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlbops}
      POSTGRES_USER: ${POSTGRES_USER:-mlbops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${MLBOPS_POSTGRES_DIR:-/srv/mlbops/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlbops} -d ${POSTGRES_DB:-mlbops}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - path: ${MLBOPS_ENV_FILE:-/srv/mlbops/env/mlbops.env}
        required: false
    environment:
      MLBOPS_DB_BACKEND: postgres
      MLBOPS_RUNTIME: vps
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlbops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlbops}
      MLB_REPO_ROOT: /app
      MLB_WAREHOUSE_DIR: /data/warehouse/mlb
      MLBOPS_OUTPUTS_DIR: /outputs
      MLB_INTEL_SNAPSHOTS_DIR: /app/morning_intel/snapshots
      HUB_CORS_ORIGINS: http://127.0.0.1:3001,http://localhost:3001,http://hub:3000
      MLBOPS_STRICT_CORS: "0"
    volumes:
      - .:/app
      - ${MLBOPS_WAREHOUSE_DIR:-/srv/mlbops/warehouse/mlb}:/data/warehouse/mlb
      - ${MLBOPS_OUTPUTS_DIR:-/srv/mlbops/outputs}:/outputs
      - ${MLBOPS_LOGS_DIR:-/srv/mlbops/logs}:/logs
      - ${MLBOPS_INTEL_SNAPSHOTS_HOST_DIR:-./morning_intel/snapshots}:/app/morning_intel/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  hub:
    build:
      context: .
      dockerfile: mlbops/hub/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${MLBOPS_ENV_FILE:-/srv/mlbops/env/mlbops.env}
        required: false
    environment:
      MLBOPS_DB_BACKEND: postgres
      MLBOPS_RUNTIME: vps
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlbops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlbops}
      FASTAPI_BASE_URL: http://api:8000
      INTERNAL_API_URL: http://api:8000
      MLBOPS_OUTPUTS_DIR: /outputs
      MLBOPS_SECURE_COOKIES: "0"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ${MLBOPS_OUTPUTS_DIR:-/srv/mlbops/outputs}:/outputs
    ports:
      - "${MLBOPS_HUB_BIND:-127.0.0.1}:${MLBOPS_HUB_PORT:-3001}:3000"
